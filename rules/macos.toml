# ───────────────────────────── More developer tools ─────────────────────────────

[[rule]]
id = "bun.cache"
name = "Bun install cache"
category = "Package managers"
paths = ["{bun_cache}"]
detect = "command -v bun"
risk = "safe"
description = "Deletes Bun's global package cache. The next install downloads packages again."
regenerates = "Refilled by bun install."
method = "tool"
tool = ["bun", "pm", "cache", "rm"]
busy = ["bun"]

[[rule]]
id = "deno.cache"
name = "Deno cache"
category = "Package managers"
paths = ["{deno_dir}/*"]
detect = "command -v deno"
risk = "safe"
description = "Deletes downloaded modules, npm packages and compiled code Deno keeps. Scripts download what they need again."
regenerates = "Refilled the next time you run deno."
method = "trash"
busy = ["deno"]

[[rule]]
id = "maven.repository"
name = "Maven local repository"
category = "Package managers"
paths = ["{maven_repo}/*"]
risk = "review"
description = "Deletes every downloaded Java library. Builds download them again, which needs network access and can take a while."
regenerates = "Re-downloaded by mvn or Gradle on the next build."
method = "trash"
busy = ["java", "mvn"]

[[rule]]
id = "conda.pkgs"
name = "Conda package cache"
category = "Package managers"
paths = ["{conda_base}/pkgs"]
detect = "command -v conda"
risk = "safe"
description = "`conda clean --all` removes unused packages, tarballs and index caches. Installed environments keep working."
regenerates = "Downloaded again when an environment needs a package."
method = "tool"
tool = ["conda", "clean", "--all", "-y"]
busy = ["conda", "python"]

[[rule]]
id = "jetbrains.caches"
name = "JetBrains IDE caches"
category = "Developer"
paths = ["~/Library/Caches/JetBrains/*"]
risk = "review"
description = "Deletes indexes and caches of IntelliJ IDEA, PyCharm, WebStorm, GoLand and friends. The next start re-indexes your projects, which takes a while. Settings and plugins are kept."
regenerates = "Rebuilt when the IDE opens a project."
method = "trash"
busy = ["idea", "pycharm", "webstorm", "goland", "clion", "rider", "phpstorm", "rubymine", "datagrip"]

[[rule]]
id = "androidstudio.caches"
name = "Android Studio caches"
category = "Developer"
paths = ["~/Library/Caches/Google/AndroidStudio*"]
risk = "review"
description = "Deletes Android Studio's indexes and caches. The next start re-indexes your projects. Settings are kept."
regenerates = "Rebuilt when Android Studio opens a project."
method = "trash"
busy = ["studio", "Android Studio"]

[[rule]]
id = "vscode.caches"
name = "VS Code caches"
category = "Developer"
app = "com.microsoft.VSCode"
paths = [
  "~/Library/Application Support/Code/Cache",
  "~/Library/Application Support/Code/CachedData",
  "~/Library/Application Support/Code/CachedExtensionVSIXs",
  "~/Library/Application Support/Code/Code Cache",
  "~/Library/Application Support/Code/GPUCache",
]
risk = "safe"
description = "Deletes VS Code's web and extension download caches. Settings, extensions and workspaces are kept."
regenerates = "Rebuilt while VS Code runs."
method = "trash"
busy = ["Code", "Code Helper"]

[[rule]]
id = "swiftpm.cache"
name = "Swift Package Manager cache"
category = "Developer"
paths = ["~/Library/Caches/org.swift.swiftpm/*"]
risk = "safe"
description = "Deletes downloaded Swift packages. Xcode and swift build fetch them again."
regenerates = "Re-downloaded on the next package resolve."
method = "trash"
busy = ["Xcode", "xcodebuild", "swift-build"]

[[rule]]
id = "carthage.cache"
name = "Carthage cache"
category = "Developer"
paths = ["~/Library/Caches/org.carthage.CarthageKit/*"]
risk = "safe"
description = "Deletes downloaded and built Carthage dependencies."
regenerates = "carthage bootstrap fetches them again."
method = "trash"
busy = ["carthage"]

[[rule]]
id = "unity.cache"
name = "Unity caches"
category = "Developer"
paths = ["~/Library/Unity/cache/*", "~/Library/Caches/com.unity3d.UnityEditor*"]
risk = "review"
description = "Deletes Unity's package and asset caches. Projects re-import what they need on the next open."
regenerates = "Rebuilt when Unity opens a project."
method = "trash"
busy = ["Unity", "Unity Hub"]

# ───────────────────────────── App caches & System ─────────────────────────────

[[rule]]
id = "appcache.library_caches"
name = "App caches (~/Library/Caches)"
category = "App caches"
paths = ["~/Library/Caches/*"]
exclude = [
  "~/Library/Caches/com.apple.*",
  "~/Library/Caches/Google",
  "~/Library/Caches/BraveSoftware",
  "~/Library/Caches/Firefox",
  "~/Library/Caches/Homebrew",
  "~/Library/Caches/CocoaPods",
  "~/Library/Caches/Yarn",
  "~/Library/Caches/pip",
  "~/Library/Caches/go-build",
  "~/Library/Caches/*.ShipIt",
  "~/Library/Caches/Arc",
  "~/Library/Caches/Microsoft Edge",
  "~/Library/Caches/Vivaldi",
  "~/Library/Caches/com.operasoftware.Opera",
  "~/Library/Caches/Chromium",
  "~/Library/Caches/JetBrains",
  "~/Library/Caches/deno",
  "~/Library/Caches/org.swift.swiftpm",
  "~/Library/Caches/org.carthage.CarthageKit",
]
risk = "review"
description = "Each app's cache folder is one item. Apps recreate caches, but some start slower or forget temporary state (for example thumbnails or offline data)."
regenerates = "Recreated by each app on demand."
method = "trash"

[[rule]]
id = "system.user_logs"
name = "User logs"
category = "System"
paths = ["~/Library/Logs/*"]
risk = "safe"
description = "Deletes app log files and crash reports. Useful only for debugging."
regenerates = "Apps write new logs as they run."
method = "trash"

[[rule]]
id = "system.updater_caches"
name = "App updater caches"
category = "System"
paths = [
  "~/Library/Caches/*.ShipIt",
  "~/Library/Caches/*/ShipIt",
  "~/Library/Application Support/Caches/*-updater",
  "~/Library/Application Support/*/pending",
]
risk = "safe"
description = "Deletes downloaded update packages that were already applied or abandoned (ShipIt, Squirrel and similar)."
regenerates = "Downloaded again when the app finds an update."
method = "trash"
busy = ["ShipIt", "Squirrel"]

[[rule]]
id = "system.trash"
name = "Trash"
category = "System"
kind = "dynamic"
dynamic = "trash"
paths = ["~/.Trash/*"]
risk = "caution"
description = "Permanently deletes everything in the Trash. This cannot be undone."
regenerates = "Not recoverable."
method = "erase"

# ───────────────────────────── Project build artifacts ─────────────────────────────
# Found by scanning folders chosen by the user. An artifact folder only counts when a marker file
# sits next to it, so a random folder named `build` is never matched.

[[rule]]
id = "artifact.node_modules"
name = "node_modules"
category = "Project build artifacts"
kind = "artifact"
dir_name = "node_modules"
markers = ["package.json"]
risk = "safe"
description = "Deletes installed dependencies for the project."
regenerates = "`npm install` / `pnpm install` / `yarn` (needs network unless a cache exists)."
method = "trash"
stale_days = 60
busy = ["node", "npm", "pnpm", "yarn"]

