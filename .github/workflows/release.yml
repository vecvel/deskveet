# Builds the universal macOS app, the Windows installers and the Linux AppImage and .deb (x64 and ARM64 each),
# and publishes them as a GitHub release with latest.json, the file installed copies read to update themselves.
#
# Runs when a version tag is pushed (git tag v1.0.0 && git push origin v1.0.0), or by hand from the Actions tab.
# Signing and notarisation are optional. Without the secrets below the release is ad-hoc signed and people
# open it with right-click > Open the first time.
#
#   APPLE_CERTIFICATE            base64 of the Developer ID Application certificate exported as .p12
#   APPLE_CERTIFICATE_PASSWORD   the password chosen when exporting it
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_API_KEY_ID             App Store Connect API key ID (the part after AuthKey_ in the file name)
#   APPLE_API_ISSUER             the issuer ID shown on the App Store Connect keys page
#   APPLE_API_KEY_P8             the contents of the AuthKey_XXXX.p8 file
#
# Required, for updates. Every update is signed; installed copies refuse anything else:
#   TAURI_SIGNING_PRIVATE_KEY           the contents of ~/.tauri/deskveet-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the contents of ~/.tauri/deskveet-updater.password

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must match the version in src-tauri/tauri.conf.json, e.g. v1.0.0)"
        required: true
      publish:
        description: "Publish the release. Untick to only build: the files are attached to the run to download and try."
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      HAS_API_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the update signing key is set
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set; installed copies could not update"; exit 1; fi

      - name: Check the tag matches the app version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match version $VERSION in tauri.conf.json"; exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - name: Tests
        run: |
          pnpm typecheck
          cd src-tauri && cargo test --release

      - name: Notarisation key
        if: ${{ env.HAS_API_KEY == 'true' }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # an unset secret arrives as an empty string; Tauri should not see those at all
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER; do
            [ -z "${!v}" ] && unset "$v"
          done
          scripts/build.sh --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Package
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p out
          cp "$BUNDLE"/dmg/*.dmg "out/Deskveet-universal.dmg"
          # the app inside is notarised by the build; the disk image needs its own ticket
          if [ "$HAS_API_KEY" = "true" ]; then
            xcrun notarytool submit "out/Deskveet-universal.dmg" --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "out/Deskveet-universal.dmg"
          fi
          ditto -c -k --keepParent "$BUNDLE/macos/Deskveet.app" "out/Deskveet-universal.app.zip"
          # what installed copies download to update (the same app, signed for the updater)
          cp "$BUNDLE/macos/Deskveet.app.tar.gz" "out/Deskveet-universal.app.tar.gz"
          cp "$BUNDLE/macos/Deskveet.app.tar.gz.sig" "out/Deskveet-universal.app.tar.gz.sig"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Rust target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile
      - name: Tests
        if: ${{ matrix.arch == 'x64' }}
        run: |
          pnpm typecheck
          cd src-tauri && cargo test --release

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Package
        run: |
          REL=src-tauri/target/${{ matrix.target }}/release
          mkdir -p out portable
          SETUP=$(ls "$REL"/bundle/nsis/*-setup.exe)
          cp "$SETUP" "out/Deskveet-${{ matrix.arch }}-setup.exe"
          cp "$SETUP.sig" "out/Deskveet-${{ matrix.arch }}-setup.exe.sig"
          # portable: just the program (WebView2 comes with Windows 10 and 11); it does not update itself
          cp "$REL/deskveet.exe" portable/Deskveet.exe
          (cd portable && 7z a -tzip "../out/Deskveet-${{ matrix.arch }}-portable.zip" Deskveet.exe > /dev/null)
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: out/*

  linux:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          # 22.04 so the AppImage runs on older systems too (it uses the oldest glibc it was built with)
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build packages
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev file
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-${{ matrix.arch }}

      - run: pnpm install --frozen-lockfile
      - name: Tests
        if: ${{ matrix.arch == 'amd64' }}
        run: |
          pnpm typecheck
          cd src-tauri && cargo test --release

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Package
        run: |
          B=src-tauri/target/release/bundle
          mkdir -p out
          IMG=$(ls "$B"/appimage/*.AppImage)
          cp "$IMG" "out/Deskveet-${{ matrix.arch }}.AppImage"
          cp "$IMG.sig" "out/Deskveet-${{ matrix.arch }}.AppImage.sig"
          cp "$(ls "$B"/deb/*.deb)" "out/Deskveet-${{ matrix.arch }}.deb"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: out/*

  publish:
    needs: [macos, windows, linux]
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Update manifest and checksums
        run: |
          node scripts/latest-json.mjs out "$TAG" > out/latest.json
          cat out/latest.json
          (cd out && sha256sum $(ls | grep -v '\.sig$') > SHA256SUMS.txt)
          ls -l out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "Deskveet ${TAG#v}" --generate-notes --verify-tag
          fi
