[package]
name = "deskveet"
version = "0.1.0"
description = "Light, fast, privacy-first disk & system cleanup"
edition = "2021"
rust-version = "1.85"
resolver = "3"
publish = false

[lib]
name = "deskveet_lib"
path = "src/lib.rs"

[[bin]]
name = "deskveet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", default-features = false, features = [] }

[dependencies]
# Offline only: nothing below opens a socket. `custom-protocol` is added by `tauri build`.
tauri = { version = "2", default-features = false, features = ["wry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.36", default-features = false, features = ["system", "disk", "user"] }
libc = "0.2"
rayon = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
glob = "0.3"

# Moving to the Trash: on macOS we call NSFileManager.trashItemAtURL ourselves (the same call the `trash`
# crate makes) because it hands back the exact Trash path, which the undo log needs and which cannot be
# discovered by listing ~/.Trash without Full Disk Access. Other platforms use the `trash` crate.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL", "NSArray", "NSData", "NSDictionary", "NSGeometry"] }
# Running apps (the Apps tab): NSWorkspace / NSRunningApplication, and their icons as small PNGs.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
trash = { version = "5", default-features = false }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"

# Size/RAM first: this is the whole point of the app.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[profile.dev]
debug = 0
